server {
    listen 80;
    server_name _;

    # Re-resolve the api service on every request — Docker gives containers
    # new IPs when they are recreated, and nginx otherwise caches the old one
    # until it restarts (502 Bad Gateway).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_backend http://api:8000;
    set $mock_backend http://mockbbb:9090;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass $api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 5m;
    }

    # Serve the mock BBB room from the SAME origin as the SPA and API so one
    # host (and one HTTPS tunnel) covers everything: invite links point at
    # ${PUBLIC_APP_URL}/bigbluebutton/... and land on the mockbbb service.
    location /bigbluebutton/ {
        proxy_pass $mock_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        client_max_body_size 5m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
